name: Release BuJo Lineage

# Explicit dispatch avoids a second release job when assets are published locally.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version matching manifest.json (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run lint && npm run build
      - run: python3 scripts/package.py
      - name: Verify version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e 'if (require("./manifest.json").version !== process.env.RELEASE_TAG) throw Error("Tag must match manifest version")'
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "BuJo Lineage $RELEASE_TAG" --generate-notes \
            main.js manifest.json styles.css LICENSE UPSTREAM.md \
            "dist/bujo-lineage-$RELEASE_TAG.zip" \
            "dist/bujo-lineage-source-$RELEASE_TAG.zip"
